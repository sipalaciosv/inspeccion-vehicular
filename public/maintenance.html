<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Error | Algo salió mal</title>
    <meta name="robots" content="noindex,nofollow" />
    <style>
      html,body{height:100%}
      body{
        margin:0; display:flex; align-items:center; justify-content:center;
        font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Arial,sans-serif;
        background:#0a0a0a; color:#e5e7eb;
      }
      .card{
        width:min(600px,92vw); text-align:center;
        background:#111; border:1px solid #222; border-radius:16px;
        padding:40px 28px; box-shadow:0 10px 30px rgba(0,0,0,.35);
      }
      h1{font-size:28px; margin:0 0 10px}
      p{margin:6px 0 0; color:#9ca3af; line-height:1.6}
      .mono{font-family:ui-monospace,monospace; color:#a3a3a3; margin-top:18px; font-size:14px}
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Algo salió mal</h1>
      <p>No se pudo procesar tu solicitud. Intenta nuevamente en unos momentos.</p>
      <p class="mono">HTTP 500 — Internal Server Error</p>
    </div>
  </body>
</html>
